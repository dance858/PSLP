name: Code Formatting

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  format:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v5

      # Pinned so formatting rules do not change under us when brew updates
      - name: Install clang-format
        run: pip install clang-format==22.1.8

      # Check formatting
      - name: Check C/C++ formatting
        run: |
          if ! git ls-files '*.c' '*.h' | xargs clang-format --dry-run -Werror; then
            echo "ERROR: Some files are not properly formatted."
            echo "Fix with: git ls-files '*.c' '*.h' | xargs clang-format -i"
            exit 1
          fi
          echo "All files are properly formatted."